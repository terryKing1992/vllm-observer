name: observer-tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,langfuse]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts bootstrap
      - run: python -m ruff format --check src tests scripts bootstrap
