name: vllm-observer-model

include:
  - compose.yaml

x-observer-environment: &observer-environment
  PYTHONPATH: "${OBSERVER_CONTAINER_PYTHONPATH:-/opt/vllm-observer/bootstrap}"
  OBSERVER_ENABLED: "${OBSERVER_ENABLED:-1}"
  OBSERVER_SERVICE: "${OBSERVER_SERVICE:-local-qwen}"
  OBSERVER_MODEL: "${SERVED_MODEL_NAME:-qwen-observed}"
  OBSERVER_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
  OBSERVER_LANGFUSE_ENABLED: "${OBSERVER_LANGFUSE_ENABLED:-0}"
  OBSERVER_ENVIRONMENT: development
  LANGFUSE_BASE_URL: "${LANGFUSE_BASE_URL:-http://host.docker.internal:3000}"
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DISABLE_TELEMETRY: "1"
  VLLM_NO_USAGE_STATS: "1"

x-model: &model
  ports:
    - "127.0.0.1:${MODEL_PORT:-18000}:8000"
  volumes:
    - huggingface-cache:/root/.cache/huggingface
  shm_size: 1gb
  init: true
  stop_grace_period: 30s
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    - prometheus
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
    interval: 15s
    timeout: 5s
    start_period: 180s
    retries: 20

services:
  model-gpu:
    <<: *model
    profiles: [gpu]
    image: vllm-observer:0.1.0-vllm0.29.0-cuda
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VLLM_BASE_IMAGE: "${VLLM_GPU_IMAGE:-vllm/vllm-openai:v0.29.0}"
    gpus: all
    environment:
      <<: *observer-environment
      OBSERVER_INSTANCE_ID: local-gpu-01
    command:
      - "${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}"
      - --served-model-name
      - "${SERVED_MODEL_NAME:-qwen-observed}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - half
      - --max-model-len
      - "2048"
      - --max-num-seqs
      - "4"
      - --gpu-memory-utilization
      - "0.5"
      - --enforce-eager

  model-cpu:
    <<: *model
    profiles: [cpu]
    image: vllm-observer:0.1.0-vllm0.29.0-cpu
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VLLM_BASE_IMAGE: "${VLLM_CPU_IMAGE:-vllm/vllm-openai-cpu:v0.29.0-x86_64}"
    environment:
      <<: *observer-environment
      OBSERVER_INSTANCE_ID: local-cpu-01
      VLLM_CPU_KVCACHE_SPACE: "1"
      VLLM_CPU_OMP_THREADS_BIND: "0-3"
    cpuset: "0-3"
    cap_add: [SYS_NICE]
    command:
      - "${MODEL_ID:-Qwen/Qwen2.5-0.5B-Instruct}"
      - --served-model-name
      - "${SERVED_MODEL_NAME:-qwen-observed}"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - "1024"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "1024"
      - --enforce-eager

volumes:
  huggingface-cache:
